MEMORY {
    ZP:   file = "", start = $0000, size = $0100, type = rw;
    RAM:  file = "", start = $0400, size = $0400, type = rw;
    LOW:  file = %O, start = $8000, size = $4000, type = ro, fill = yes, fillval = $ff;
    PRG:  file = %O, start = $C000, size = $4000, type = ro, fill = yes, fillval = $ff;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    LOW:      load = LOW, type = ro;
    FONT:     load = PRG, type = ro, align = $1000;
    TABLES:   load = PRG, type = ro, align = $100;
    RODATA:   load = PRG, type = ro;
    CODE:     load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
}
