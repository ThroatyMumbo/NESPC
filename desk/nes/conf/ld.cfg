# 64 KiB PRG: bank 0 the pictures, then the fixed kernel, then shell banks 2-3, each with its own RAM (tools/bankcheck.py).

MEMORY {
    ZP:   file = "", start = $0000, size = $00C0, type = rw; # $C0-$EF belong to apps
    GZP:  file = "", start = $00F0, size = $0010, type = rw; # gfx.s's arguments, the apps' K_X and on
    STUB: file = "", start = $0300, size = $0100, type = rw; # main.s's menu stub and launch.s's stub
    RAM:  file = "", start = $0400, size = $0400, type = rw;
    WRAM: file = "", start = $6000, size = $2000, type = rw;
    LOW:  file = %O, start = $8000, size = $4000, type = ro, fill = yes, fillval = $ff, bank = 0;
    PRG:  file = %O, start = $C000, size = $4000, type = ro, fill = yes, fillval = $ff;
    SHELL: file = %O, start = $8000, size = $4000, type = rw, fill = yes, fillval = $ff, bank = 2;
    SHELL3: file = %O, start = $8000, size = $4000, type = rw, fill = yes, fillval = $ff, bank = 3;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    GFXZP:    load = GZP, type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    BLOCKS:   load = WRAM, type = bss, start = $6000;
    WRAM:     load = WRAM, type = bss;
    LOWDATA:  load = LOW, type = ro;
    RODATA:   load = PRG, type = ro;
    CODE:     load = PRG, type = ro;
    SHELL:    load = SHELL, type = ro;
    SHELL_BSS: load = SHELL, type = bss, define = yes;
    SHELL3:   load = SHELL3, type = ro;
    SHELL3_BSS: load = SHELL3, type = bss, define = yes;
    STUB:     load = PRG, run = STUB, type = ro, define = yes;
    JUMPS:    load = PRG, type = ro, start = $FF00;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
}
